name: Python and Jinja validation

on:
  push:
    branches: [feature/dev-role]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install template parser
        run: python -m pip install Jinja2
      - name: Compile application
        run: python -m py_compile app_returns_test.py database.py database_sqlite.py
      - name: Parse all HTML templates
        run: python -c "import pathlib; from jinja2 import Environment, FileSystemLoader; e=Environment(loader=FileSystemLoader('templates')); files=list(pathlib.Path('templates').glob('*.html')); [e.get_template(p.name) for p in files]; print(f'Parsed {len(files)} templates successfully')"
