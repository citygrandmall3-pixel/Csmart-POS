<script>
document.addEventListener("click", function() {
    setTimeout(function() {
        let rows = document.querySelectorAll("#saleItemsTable tbody tr");
        let totalItems = rows.length;
        let totalPrice = 0;
        rows.forEach(row => {
            let cells = row.querySelectorAll("td");
            if (cells.length >= 3) {
                let priceText = cells[2].innerText.replace(/[^0-9.]/g, "");
                totalPrice += parseFloat(priceText) || 0;
            }
        });
        let itemsEl = document.getElementById("summaryTotalItems");
        let priceEl = document.getElementById("summaryTotalPrice");
        if (itemsEl) itemsEl.innerText = totalItems;
        if (priceEl) priceEl.innerText = totalPrice.toFixed(2) + " ج.م";
    }, 500);
});
</script>
