<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>متابعة طلبات التوصيل</title><style>body{font-family:Tahoma;background:#f4f6f9;margin:0;padding:16px;color:#222}.wrap{max-width:1200px;margin:auto;background:white;padding:18px;border-radius:10px}h2{text-align:center}.bar{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}button,a,select{padding:9px;border:1px solid #ccc;border-radius:5px;font:inherit}button{cursor:pointer;background:#174b83;color:white}a{background:#6c757d;color:white;text-decoration:none}.tablebox{overflow:auto}table{width:100%;border-collapse:collapse;min-width:1050px}th,td{border:1px solid #ddd;padding:9px;text-align:right}th{background:#eef5ff}#message{padding:12px;background:#f5f5f5;margin:10px 0}.collect{background:#198754}</style></head><body><main class="wrap"><h2>متابعة طلبات التوصيل المعلقة</h2><div class="bar"><button id="refresh">تحديث القائمة</button><a href="/delivery">إنشاء طلب توصيل</a><a href="/sales">العودة للمبيعات</a></div><div id="message">جارٍ تحميل الطلباات....</div><div class="tablebox"><table><thead><tr><th>الفاتورة</th><th>العميل</th><th>الهاتف</th><th>العنوان</th><th>المندوب</th><th>المنطقة</th><th>الإجمالي</th><th>المتبقي</th><th>التسليم</th><th>التحصيل</th><th>الإجراء</th></tr></thead><tbody id="rows"></tbody></table></div></main><script>const rows=document.getElementById("rows"),msg=document.getElementById("message");const money=v=>Number(v||0).toLocaleString("ar-EG",{minimumFractionDigits:2,maximumFractionDigits:2});const label=v=>v==="delivered"?"تم التسليم":v==="collected"?"تم التحصيل":"معلق";async function load(){msg.textContent="جارٍ تحميل الطلبات...";rows.replaceChildren();try{const r=await fetch("/api/sales/delivery/pending",{credentials:"same-origin"}),d=await r.json();if(r.ok===false||d.ok===false)throw Error(d.error||"تعذر تحميل القائمة");const list=Array.isArray(d.orders)?d.orders:[];msg.textContent=list.length?"عدد الطلبات المعلقة: "+list.length:"لا توجد طلبات توصيل معلقة.";list.forEach(o=>{const tr=document.createElement("tr");[o.invoice_no,o.customer_name,o.phone,o.address,o.rep,o.region_name,money(o.grand_total),money(o.remaining_amount),label(o.delivery_status),label(o.collection_status)].forEach(v=>{const td=document.createElement("td");td.textContent=v==null?"":v;tr.appendChild(td)});const td=document.createElement("td");if(o.collection_status==="collected"){td.textContent="تم التحصيل"}else{const sel=document.createElement("select");sel.className="method";[["cash","نقدي"],["bank_ahly","البنك الأهلي"],["bank_misr","بنك مصر"]].forEach(x=>{const op=document.createElement("option");op.value=x[0];op.textContent=x[1];sel.appendChild(op)});const b=document.createElement("button");b.type="button";b.className="collect";b.textContent="تحصيل";b.dataset.id=String(o.sale_id);td.append(sel,b)}tr.appendChild(td);rows.appendChild(tr)})}catch(e){msg.textContent=e.message||"حدث خطأ"}}document.getElementById("refresh").addEventListener("click",load);rows.addEventListener("click",async e=>{const b=e.target.closest(".collect");if(b==null)return;const method=b.parentElement.querySelector(".method");if(method==null||confirm("تأكيد تحصيل المتبقي لهذه الفاتورة؟")===false)return;b.disabled=true;try{const r=await fetch("/api/sales/"+encodeURIComponent(b.dataset.id)+"/delivery/collect",{method:"POST",credentials:"same-origin",headers:{"Content-Type":"application/json"},body:JSON.stringify({payment_method:method.value})}),d=await r.json();if(r.ok===false||d.ok===false)throw Error(d.error||"تعذر تنفيذ التحصيل");msg.textContent="تم التحصيل بنجاح";await load()}catch(e){msg.textContent=e.message||"فشل التحصيل";b.disabled=false}});load();</script></body></html>
